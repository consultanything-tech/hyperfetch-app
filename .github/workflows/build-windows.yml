name: Build Windows Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (NSIS & MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'desktop/pnpm-lock.yaml'

      - name: Install Frontend Dependencies
        working-directory: ./desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Desktop Application
        working-directory: ./desktop
        run: pnpm tauri build

      - name: Upload Windows NSIS Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: HyperFetch-Windows-x64-Setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI Installer (.msi)
        uses: actions/upload-artifact@v4
        with:
          name: HyperFetch-Windows-x64-MSI
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Publish Windows Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
